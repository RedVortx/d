name: CTF AWS Discovery

on:
  workflow_dispatch:
  push:
    branches:
      - corgi

permissions:
  id-token: write
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1
          role-session-name: ctf-discovery

      - name: Verify identity
        run: |
          set -euo pipefail
          aws sts get-caller-identity

      - name: Discover frontend and API endpoints
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p discovery

          echo "=== CloudFront distributions ==="
          aws cloudfront list-distributions \
            --query 'DistributionList.Items[].{
              Id:Id,
              DomainName:DomainName,
              Status:Status,
              Enabled:Enabled,
              Origins:Origins.Items[].DomainName
            }' \
            --output json | tee discovery/cloudfront.json

          echo
          echo "=== API Gateway REST APIs ==="
          aws apigateway get-rest-apis \
            --query 'items[].{Id:id,Name:name,Description:description}' \
            --output json | tee discovery/api-gateway-rest.json

          echo
          echo "=== API Gateway HTTP/WebSocket APIs ==="
          aws apigatewayv2 get-apis \
            --query 'Items[].{
              ApiId:ApiId,
              Name:Name,
              ProtocolType:ProtocolType,
              ApiEndpoint:ApiEndpoint
            }' \
            --output json | tee discovery/api-gateway-v2.json

          echo
          echo "=== S3 buckets ==="
          aws s3api list-buckets \
            --query 'Buckets[].Name' \
            --output json | tee discovery/s3-buckets.json

          echo
          echo "=== Lambda functions ==="
          aws lambda list-functions \
            --query 'Functions[].{
              FunctionName:FunctionName,
              Runtime:Runtime,
              Description:Description
            }' \
            --output json | tee discovery/lambda-functions.json

          echo
          echo "=== Candidate frontend URLs ==="

          python - <<'PY'
          import json
          from pathlib import Path

          cloudfront = json.loads(
              Path("discovery/cloudfront.json").read_text()
          )

          for item in cloudfront:
              domain = item.get("DomainName")
              if domain:
                  print(f"https://{domain}")

          apis = json.loads(
              Path("discovery/api-gateway-v2.json").read_text()
          )

          for item in apis:
              endpoint = item.get("ApiEndpoint")
              if endpoint:
                  print(endpoint)
          PY

      - name: Inspect S3 bucket metadata
        shell: bash
        run: |
          set -euo pipefail

          while read -r bucket; do
            [ -z "$bucket" ] && continue

            echo "=== Bucket: $bucket ==="

            aws s3api get-bucket-location \
              --bucket "$bucket" \
              --output json || true

            aws s3api get-bucket-policy-status \
              --bucket "$bucket" \
              --output json || true

            aws s3api get-bucket-policy \
              --bucket "$bucket" \
              --output json || true
          done < <(
            jq -r '.[]' discovery/s3-buckets.json
          )

      - name: Upload discovery results
        uses: actions/upload-artifact@v4
        with:
          name: aws-discovery-results
          path: discovery/
